<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bisaya Study App</title>
<style>
  :root {
    --bg: #faf9f6; --card: #ffffff; --border: #e2e0d8; --border-strong: #c9c6ba;
    --text: #1e1d1a; --text-secondary: #6b6a63; --text-muted: #9c9a90;
    --success-bg: #eaf3de; --success-text: #27500a; --success-border: #97c459;
    --danger-bg: #fcebeb; --danger-text: #791f1f; --danger-border: #e24b4a;
    --accent: #185fa5; --accent-bg: #e6f1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f; --card: #201f19; --border: #3a382f; --border-strong: #4c4a3f;
      --text: #f1efe8; --text-secondary: #b4b2a9; --text-muted: #888780;
      --success-bg: #173404; --success-text: #c0dd97; --success-border: #639922;
      --danger-bg: #501313; --danger-text: #f7c1c1; --danger-border: #e24b4a;
      --accent: #85b7eb; --accent-bg: #042c53;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; text-align: center; }
  .subtitle { font-size: 13px; color: var(--text-secondary); text-align: center; margin: 0 0 20px; }
  .meta-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
  .prompt-label { font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 6px; }
  .prompt-word { font-size: 28px; font-weight: 600; text-align: center; margin-bottom: 8px; }
  .prompt-tl { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 16px; font-style: italic; }
  .prompt-sentence { font-size: 20px; font-weight: 500; text-align: center; margin-bottom: 8px; line-height: 1.5; }
  .prompt-en { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options.stacked { grid-template-columns: 1fr; }
  button { font-family: inherit; cursor: pointer; }
  button.option {
    padding: 14px 10px; font-size: 14px; border-radius: 10px;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text);
    transition: transform 0.05s ease;
  }
  button.option:hover:not(:disabled) { background: rgba(128,128,128,0.08); }
  button.option:active:not(:disabled) { transform: scale(0.98); }
  button.option:disabled { cursor: default; }
  button.option.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  button.option.wrong { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
  .feedback { min-height: 20px; text-align: center; font-size: 14px; margin-top: 16px; font-weight: 500; }
  .feedback.correct { color: var(--success-text); }
  .feedback.wrong { color: var(--danger-text); }
  .explain { font-size: 12px; color: var(--text-secondary); text-align: center; margin-top: 8px; font-weight: 400; }
  .tl-note { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 6px; font-weight: 400; font-style: italic; }
  .end-screen { text-align: center; padding: 8px 0; }
  .end-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .end-score { font-size: 40px; font-weight: 700; margin-bottom: 20px; }
  .best { font-size: 12px; color: var(--text-muted); margin-top: 14px; }
  button.primary {
    padding: 12px 24px; font-size: 14px; font-weight: 500; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; width: 100%; margin-bottom: 10px;
  }
  button.primary:hover { opacity: 0.9; }
  button.secondary {
    padding: 12px 24px; font-size: 14px; font-weight: 500; border-radius: 10px;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text); width: 100%; margin-bottom: 10px;
  }
  button.secondary:hover { background: rgba(128,128,128,0.08); }
  .menu-stats { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 22px; }
  .back-row { margin-bottom: 18px; }
  button.back { background: none; border: none; color: var(--text-secondary); font-size: 13px; padding: 4px 0; }
  button.back:hover { color: var(--text); }
  .field-row { margin-bottom: 18px; }
  .field-label { font-size: 13px; font-weight: 500; margin-bottom: 8px; display: block; }
  select, input[type=text] {
    width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--border-strong); background: var(--card); color: var(--text); font-family: inherit;
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border-strong); border-radius: 24px; transition: 0.15s; }
  .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.15s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(18px); }
  .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab { padding: 8px 4px; margin-right: 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .wordlist { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
  .word-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px; }
  .word-row:last-child { border-bottom: none; }
  .word-row .word-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .word-row .word-ceb { font-weight: 500; }
  .word-row .word-en { color: var(--text-secondary); }
  .word-row .word-tl { color: var(--text-muted); font-size: 11px; }
  button.del { background: none; border: none; color: var(--danger-text); font-size: 12px; padding: 4px 8px; flex-shrink: 0; }
  .add-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .add-form-row { display: flex; gap: 8px; }
  .add-form-row input { flex: 1; }
  .add-form button.addbtn { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent-bg); color: var(--accent); font-size: 13px; font-weight: 500; }
  .count-note { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .timer-bar-wrap { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
  .timer-bar { height: 100%; background: var(--accent); transition: width 0.2s linear; }
</style>
</head>

/* ---------- Data: grammar quiz ---------- */
const GRAMMAR_QUESTIONS = [
  { tl:"Kumain ako ng tinapay.", en:"I ate bread.", sentence:"___ ko ug tinapay.",
    answer:"Mikaon", options:["Mikaon","Gikaon","Kaonon","Naghatag"],
    explain:"Actor focus, past — mi- marks the doer as the focus." },
  { tl:"Bibili ako ng bahay bukas.", en:"I will buy a house tomorrow.", sentence:"___ ko ug balay ugma.",
    answer:"Mopalit", options:["Mopalit","Gipalit","Palitan","Nagpalit"],
    explain:"Actor focus, future/potential — mo- for actions not yet started." },
  { tl:"Nagluluto ang mga bata ngayon.", en:"The kids are cooking right now.", sentence:"___ ang mga bata karon.",
    answer:"Nagluto", options:["Nagluto","Miluto","Lutoon","Giluto"],
    explain:"Actor focus, ongoing/habitual — nag- for actions in progress." },
  { tl:"Binili ko ang libro.", en:"I bought the book.", sentence:"___ nako ang libro.",
    answer:"Gipalit", options:["Gipalit","Mipalit","Palitan","Nagpalit"],
    explain:"Object focus, past — gi- because 'the book' is the focused topic." },
  { tl:"Kinain niya ang saging.", en:"He ate the banana.", sentence:"Gikaon ___ ang saging.",
    answer:"niya", options:["niya","siya","iya","kaniya"],
    explain:"Object-focus (gi-) verbs pair with a genitive actor: niya, not siya." },
  { tl:"Kumain siya ng saging.", en:"He ate a banana.", sentence:"___ mikaon ug saging.",
    answer:"Siya", options:["Siya","Niya","Kaniya","Iya"],
    explain:"Actor-focus (mi-) verbs pair with a nominative actor: siya, not niya." },
  { tl:"Hinugasan niya ang plato.", en:"She washed the dish.", sentence:"___ niya ang plato.",
    answer:"Gihugasan", options:["Gihugasan","Ginhugas","Hugasan","Naghugas"],
    explain:"Locative/beneficiary focus, past — gi- stacks onto the -an suffix (dish is the surface acted on)." },
  { tl:"May pera ako.", en:"I have money.", sentence:"___ koy kwarta.",
    answer:"Naa", options:["Naa","Wala","Dili","Ayaw"],
    explain:"Naa marks existence/possession — 'there is/I have.'" },
  { tl:"Hindi ako kumain ng tinapay.", en:"I didn't eat bread.", sentence:"___ ko mikaon ug tinapay.",
    answer:"Wala", options:["Wala","Dili","Ayaw","Gawas"],
    explain:"Wala negates a completed past action; dili would imply refusal, not what happened." },
  { tl:"Ayaw niyang kumain ng gulay.", en:"He doesn't want to eat vegetables.", sentence:"___ siya ganahan mokaon ug utan.",
    answer:"Dili", options:["Dili","Wala","Ayaw","Wa"],
    explain:"Dili negates a general/present state (not wanting), not a completed action." },
  { tl:"Gutom ako.", en:"I'm hungry.", sentence:"Gutom ___.",
    answer:"ko", options:["ko","nako","akong","kanako"],
    explain:"Plain adjectives always pair with the nominative pronoun (ko), no exceptions." },
  { tl:"Binigyan niya ako ng pera.", en:"She gave me the money.", sentence:"Gihatag niya ___ ang kwarta.",
    answer:"kanako", options:["kanako","nako","ko","akong"],
    explain:"Plain gi- (no -an) constructions mark the recipient with kana- forms: kanako, not nako." },
  { tl:"Tinuruan niya ako ng Bisaya.", en:"She taught me Bisaya.", sentence:"Gitudluan niya ___ ug Bisaya.",
    answer:"ko", options:["ko","nako","kanako","akong"],
    explain:"Unlike plain gi-, gi-...-an constructions put the focused recipient in nominative: ko, not kanako." },
  { tl:"May gwapang babae sa tabi ko.", en:"There's a pretty girl beside me.", sentence:"Naa'y gwapa nga babaye sa ___ tabi.",
    answer:"akong", options:["akong","nako","kanako","ko"],
    explain:"Possessives attached directly to nouns use akong/imong/iyang, a distinct set from nako/nimo/niya." },
  { tl:"Tutulungan kita.", en:"I will help you.", sentence:null,
    answer:"Tabangan ko ka", options:["Tabangan ko ka","Motabang kita","Tabangan ka nako","Tabangan mo ko"],
    explain:"Kita means 'you and I' (inclusive we) — not 'I...you'. That's a genuine trap for Tagalog speakers." },
  { tl:"Kinain mo ang saging.", en:"You ate the banana.", sentence:"___ nimo ang saging.",
    answer:"Gikaon", options:["Gikaon","Gikaonon","Kaonon","Nikaon"],
    explain:"-on (object focus) drops entirely in past tense — gi- alone does the job, unlike -an which stacks." },
  { tl:"Hindi pa siya nakakatawa.", en:"She hasn't laughed yet.", sentence:"Wala ___ siya makatawa.",
    answer:"pa", options:["pa","na","ra","gyud"],
    explain:"Wala pa = 'not yet' for a completed action that hasn't happened; na would mean 'already.'" },
  { tl:"Nakipaghiwalay kami noong nakaraang buwan lang.", en:"We broke up just last month.", sentence:null,
    answer:"Nakigbulag mi miaging bulan ra", options:["Nakigbulag mi miaging bulan ra","Nakigbulag ra mi miaging bulan","Ra nakigbulag mi miaging bulan","Miaging ra bulan nakigbulag mi"],
    explain:"Ra sits right after the word it modifies — here, 'miaging bulan' (just last month), for recency emphasis." }
];

/* ---------- Settings & storage ---------- */
const DEFAULT_SETTINGS = { count: 10, timerEnabled: false, timerSeconds: 15, tagalogMode: 'feedback' };

const LS_WORDS = 'bisaya-quiz-words';

const LS_BEST_WORD = 'bisaya-quiz-best-word';

function safeGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function safeSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

function getWords() { return safeGet(LS_WORDS, DEFAULT_WORDS); }
function setWords(w) { safeSet(LS_WORDS, w); }
function getSettings() { return Object.assign({}, DEFAULT_SETTINGS, safeGet(LS_SETTINGS, {})); }
function setSettings(s) { safeSet(LS_SETTINGS, s); }
function getBest(mode) { return safeGet(mode === 'grammar' ? LS_BEST_GRAMMAR : LS_BEST_WORD, 0); }
function setBest(mode, v) { safeSet(mode === 'grammar' ? LS_BEST_GRAMMAR : LS_BEST_WORD, v); }

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

/* ---------- State ---------- */
let screen = 'menu';       // menu | settings | quiz | end
let mode = 'word';         // word | grammar
let settingsTab = 'wordbank'; // wordbank | quiz
let quiz = [], qIndex = 0, score = 0, streak = 0, answered = false;
let timerInterval = null;

const app = document.getElementById('app');

function render() {
  if (screen === 'menu') return renderMenu();
  if (screen === 'settings') return renderSettings();
  if (screen === 'quiz') return renderQuiz();
  if (screen === 'end') return renderEnd();
}

/* ---------- Menu ---------- */
function renderMenu() {
  const words = getWords();
  const bestWord = getBest('word');
  const bestGrammar = getBest('grammar');
  app.innerHTML = `
    <div class="menu-stats">${words.length} words &middot; word best ${bestWord} &middot; grammar best ${bestGrammar}</div>
    <button class="primary" id="wordQuiz">Word quiz</button>
    <button class="primary" id="grammarQuiz">Grammar quiz</button>
    <button class="secondary" id="settings">Settings</button>
  `;
  document.getElementById('wordQuiz').onclick = () => { mode = 'word'; screen = 'quiz'; startQuiz(); };
  document.getElementById('grammarQuiz').onclick = () => { mode = 'grammar'; screen = 'quiz'; startQuiz(); };
  document.getElementById('settings').onclick = () => { screen = 'settings'; settingsTab = 'wordbank'; render(); };
}

/* ---------- Settings ---------- */
function renderSettings() {
  app.innerHTML = `
    <div class="back-row"><button class="back" id="back">&larr; Back</button></div>
    <div class="tabs">
      <button class="tab ${settingsTab === 'wordbank' ? 'active' : ''}" id="tabWordbank">Word bank</button>
      <button class="tab ${settingsTab === 'quiz' ? 'active' : ''}" id="tabQuiz">Quiz settings</button>
    </div>
    <div id="settingsBody"></div>
  `;
  document.getElementById('back').onclick = () => { screen = 'menu'; render(); };
  document.getElementById('tabWordbank').onclick = () => { settingsTab = 'wordbank'; renderSettings(); };
  document.getElementById('tabQuiz').onclick = () => { settingsTab = 'quiz'; renderSettings(); };

  if (settingsTab === 'wordbank') renderWordbank();
  else renderQuizSettings();
}

function renderWordbank() {
  const words = getWords();
  const body = document.getElementById('settingsBody');
  body.innerHTML = `
    <div class="add-form">
      <div class="add-form-row">
        <input type="text" id="newCeb" placeholder="Cebuano word">
        <input type="text" id="newEn" placeholder="English meaning">
      </div>
      <div class="add-form-row">
        <input type="text" id="newTl" placeholder="Tagalog equivalent (optional)">
        <button class="addbtn" id="addWord">Add</button>
      </div>
    </div>
    <div class="count-note">${words.length} words &middot; need at least 4 to play</div>
    <div class="wordlist" id="wordlist"></div>
    <button class="secondary" id="resetWords">Reset to default list</button>
  `;
  const listEl = document.getElementById('wordlist');
  words.forEach((w, i) => {
    const row = document.createElement('div');
    row.className = 'word-row';
    row.innerHTML = `
      <span class="word-text">
        <span class="word-ceb">${escapeHtml(w.ceb)}</span> &mdash; <span class="word-en">${escapeHtml(w.en)}</span>
        ${w.tl ? `<br><span class="word-tl">TL: ${escapeHtml(w.tl)}</span>` : ''}
      </span>
      <button class="del" data-i="${i}">Remove</button>
    `;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('.del').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-i'), 10);
      const cur = getWords();
      cur.splice(i, 1);
      setWords(cur);
      renderWordbank();
    };
  });
  document.getElementById('addWord').onclick = () => {
    const ceb = document.getElementById('newCeb').value.trim();
    const en = document.getElementById('newEn').value.trim();
    const tl = document.getElementById('newTl').value.trim();
    if (!ceb || !en) return;
    const cur = getWords();
    const entry = { ceb, en };
    if (tl) entry.tl = tl;
    cur.push(entry);
    setWords(cur);
    renderWordbank();
  };
  document.getElementById('resetWords').onclick = () => {
    setWords(DEFAULT_WORDS);
    renderWordbank();
  };
}

function renderQuizSettings() {
  const s = getSettings();
  const words = getWords();
  const maxCount = Math.min(30, Math.max(words.length, GRAMMAR_QUESTIONS.length));
  const countOptions = [5, 10, 15, 20, 25, 30].filter(n => n <= maxCount || n === 5);
  const body = document.getElementById('settingsBody');
  body.innerHTML = `
    <div class="field-row">
      <label class="field-label">Questions per round</label>
      <select id="count">
        ${countOptions.map(n => `<option value="${n}" ${n === s.count ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="toggle-row">
      <label class="field-label" style="margin:0;">Timer per question</label>
      <label class="switch">
        <input type="checkbox" id="timerToggle" ${s.timerEnabled ? 'checked' : ''}>
        <span class="slider"></span>
      </label>
    </div>
    <div class="field-row" id="timerSecondsRow" style="${s.timerEnabled ? '' : 'display:none;'}">
      <label class="field-label">Seconds per question</label>
      <select id="timerSeconds">
        ${[5, 10, 15, 20, 30].map(n => `<option value="${n}" ${n === s.timerSeconds ? 'selected' : ''}>${n}s</option>`).join('')}
      </select>
    </div>
    <div class="field-row">
      <label class="field-label">Tagalog equivalent (word quiz)</label>
      <select id="tagalogMode">
        <option value="off" ${s.tagalogMode === 'off' ? 'selected' : ''}>Off</option>
        <option value="feedback" ${s.tagalogMode === 'feedback' ? 'selected' : ''}>Show after answering</option>
        <option value="always" ${s.tagalogMode === 'always' ? 'selected' : ''}>Show on the question too</option>
      </select>
    </div>
  `;
  document.getElementById('count').onchange = (e) => {
    const cur = getSettings(); cur.count = parseInt(e.target.value, 10); setSettings(cur);
  };
  document.getElementById('timerToggle').onchange = (e) => {
    const cur = getSettings(); cur.timerEnabled = e.target.checked; setSettings(cur);
    document.getElementById('timerSecondsRow').style.display = cur.timerEnabled ? '' : 'none';
  };
  document.getElementById('timerSeconds').onchange = (e) => {
    const cur = getSettings(); cur.timerSeconds = parseInt(e.target.value, 10); setSettings(cur);
  };
  document.getElementById('tagalogMode').onchange = (e) => {
    const cur = getSettings(); cur.tagalogMode = e.target.value; setSettings(cur);
  };
}

/* ---------- Quiz (shared engine) ---------- */
function startQuiz() {
  const s = getSettings();
  if (mode === 'word') {
    const words = getWords();
    const count = Math.min(s.count, words.length);
    quiz = shuffle(words).slice(0, count).map(w => {
      const wrongPool = shuffle(words.filter(x => x.en !== w.en)).slice(0, 3).map(x => x.en);
      return { type: 'word', ceb: w.ceb, tl: w.tl || null, answer: w.en, options: shuffle([w.en, ...wrongPool]) };
    });
  } else {
    const count = Math.min(s.count, GRAMMAR_QUESTIONS.length);
    quiz = shuffle(GRAMMAR_QUESTIONS).slice(0, count).map(q => ({ type: 'grammar', ...q, options: shuffle(q.options) }));
  }
  qIndex = 0; score = 0; streak = 0;
  render();
}

function renderQuiz() {
  const s = getSettings();
  const total = quiz.length;
  if (qIndex >= total) { screen = 'end'; return render(); }

  const q = quiz[qIndex];
  answered = false;

  let timerHtml = s.timerEnabled ? `<div class="timer-bar-wrap"><div class="timer-bar" id="timerBar" style="width:100%;"></div></div>` : '';
  let promptHtml = '';

  if (q.type === 'word') {
    const showTlNow = s.tagalogMode === 'always' && q.tl;
    promptHtml = `
      <div class="prompt-label">What does this mean?</div>
      <div class="prompt-word">${escapeHtml(q.ceb)}</div>
      ${showTlNow ? `<div class="prompt-tl">Tagalog: ${escapeHtml(q.tl)}</div>` : ''}
    `;
  } else {
    promptHtml = `
      <div class="prompt-label">Fill in the blank</div>
      <div class="prompt-sentence">${q.sentence ? escapeHtml(q.sentence).replace('___', '<u>____</u>') : 'Choose the correct sentence'}</div>
      <div class="prompt-en">${escapeHtml(q.en)}${q.tl ? ' &middot; ' + escapeHtml(q.tl) : ''}</div>
    `;
  }

  app.innerHTML = `
    <div class="meta-row">
      <span>Question ${qIndex + 1} of ${total}</span>
      <span>Score: ${score}${streak >= 2 ? ' &middot; streak ' + streak : ''}</span>
    </div>
    ${timerHtml}
    ${promptHtml}
    <div class="options ${q.type === 'grammar' && !q.sentence ? 'stacked' : ''}" id="options"></div>
    <div class="feedback" id="feedback"></div>
  `;

  const optsEl = document.getElementById('options');
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, btn, q);
    optsEl.appendChild(btn);
  });

  if (s.timerEnabled) {
    const bar = document.getElementById('timerBar');
    const totalMs = s.timerSeconds * 1000;
    const start = Date.now();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.max(0, 100 - (elapsed / totalMs) * 100);
      if (bar) bar.style.width = pct + '%';
      if (elapsed >= totalMs) {
        clearInterval(timerInterval);
        if (!answered) handleAnswer(null, null, q);
      }
    }, 100);
  }
}

function handleAnswer(opt, btn, q) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const s = getSettings();
  const correct = opt === q.answer;
  document.querySelectorAll('#options button').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
    else if (btn && b === btn) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  let text, cls;
  if (correct) {
    score++; streak++;
    text = 'Correct!'; cls = 'feedback correct';
  } else {
    streak = 0;
    text = opt === null ? `Time's up — the answer was "${q.answer}"` : `Not quite — the answer was "${q.answer}"`;
    cls = 'feedback wrong';
  }
  fb.textContent = text;
  fb.className = cls;

  if (q.type === 'grammar' && q.explain) {
    const ex = document.createElement('div');
    ex.className = 'explain';
    ex.textContent = q.explain;
    fb.appendChild(ex);
  }
  if (q.type === 'word' && s.tagalogMode === 'feedback' && q.tl) {
    const tlEl = document.createElement('div');
    tlEl.className = 'tl-note';
    tlEl.textContent = `Tagalog: ${q.tl}`;
    fb.appendChild(tlEl);
  }

  setTimeout(() => { qIndex++; render(); }, q.type === 'grammar' ? 1800 : 1100);
}

function renderEnd() {
  const total = quiz.length;
  const best = getBest(mode);
  if (score > best) setBest(mode, score);
  app.innerHTML = `
    <div class="end-screen">
      <div class="end-label">${mode === 'grammar' ? 'Grammar quiz' : 'Word quiz'} complete</div>
      <div class="end-score">${score} / ${total}</div>
      <button class="primary" id="again">Play again</button>
      <button class="secondary" id="menu">Main menu</button>
      <div class="best">Best score: ${Math.max(score, best)} / ${total}</div>
    </div>
  `;
  document.getElementById('again').onclick = () => { screen = 'quiz'; startQuiz(); };
  document.getElementById('menu').onclick = () => { screen = 'menu'; render(); };
}

if (!safeGet(LS_WORDS, null)) setWords(DEFAULT_WORDS);
render();
</script>
</body>
</html>
